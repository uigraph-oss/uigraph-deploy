apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "mcp") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  {{- if not .Values.mcp.autoscaling.enabled }}
  replicas: {{ .Values.mcp.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uigraph.componentSelectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uigraph.componentLabels" (dict "root" . "component" "mcp") | nindent 8 }}
      annotations:
        {{- include "uigraph.podAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: '{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          envFrom:
            - configMapRef:
                name: {{ include "uigraph.componentFullname" (dict "root" . "component" "mcp") }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
