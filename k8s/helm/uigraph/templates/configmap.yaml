apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "api") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  UIGRAPH_DOMAIN: {{ include "uigraph.appHost" . | quote }}
  UIGRAPH_PUBLIC_URL: {{ include "uigraph.publicUrl" . | quote }}
  UIGRAPH_FRONTEND_URL: {{ include "uigraph.frontendUrl" . | quote }}
  UIGRAPH_INTERNAL_FRONTEND_URL: {{ include "uigraph.internalFrontendUrl" . | quote }}
  {{- if .Values.app.cookieDomain }}
  UIGRAPH_COOKIE_DOMAIN: {{ .Values.app.cookieDomain | quote }}
  {{- end }}
  UIGRAPH_ADMIN_EMAIL: {{ .Values.app.adminEmail | quote }}
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  STORAGE_ENDPOINT: {{ include "uigraph.storageEndpoint" . | quote }}
  STORAGE_PUBLIC_ENDPOINT: {{ .Values.storage.publicEndpoint | quote }}
  STORAGE_BUCKET: {{ .Values.storage.bucket | quote }}
  STORAGE_REGION: {{ .Values.storage.region | quote }}
  STORAGE_FORCE_PATH_STYLE: {{ .Values.storage.forcePathStyle | quote }}
  FIGMA_CLIENT_ID: {{ .Values.figma.clientId | quote }}
  FIGMA_REDIRECT_URI: {{ include "uigraph.figmaRedirectUri" . | quote }}
  GITHUB_APP_ID: {{ .Values.githubApp.appId | quote }}
  GITHUB_APP_SLUG: {{ .Values.githubApp.slug | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.githubApp.clientId | quote }}
  SLACK_CLIENT_ID: {{ .Values.slackApp.clientId | quote }}
  UIGRAPH_ENTERPRISE: {{ .Values.app.enterpriseEnabled | quote }}
  {{- if .Values.app.enterpriseServiceUrl }}
  UIGRAPH_ENTERPRISE_SERVICE_URL: {{ .Values.app.enterpriseServiceUrl | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "graphql") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "graphql") | nindent 4 }}
data:
  PORT: {{ .Values.graphql.port | quote }}
  ENV: 'production'
  API_BASE_URL: {{ include "uigraph.internalApiUrl" . | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "gateway") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
data:
  PORT: {{ .Values.gateway.port | quote }}
  UIGRAPH_API_URL: {{ include "uigraph.internalApiUrl" . | quote }}
  UIGRAPH_MCP_URL: {{ include "uigraph.internalMcpUrl" . | quote }}
  STORAGE_ENDPOINT: {{ include "uigraph.storageEndpoint" . | quote }}
  STORAGE_PUBLIC_ENDPOINT: {{ .Values.storage.publicEndpoint | quote }}
  STORAGE_BUCKET: {{ .Values.storage.bucket | quote }}
  STORAGE_REGION: {{ .Values.storage.region | quote }}
  STORAGE_FORCE_PATH_STYLE: {{ .Values.storage.forcePathStyle | quote }}
  AI_PROVIDER_NPM: {{ .Values.gateway.aiProvider.npm | quote }}
  AI_PROVIDER_MODEL: {{ .Values.gateway.aiProvider.model | quote }}
  {{- if .Values.gateway.aiProvider.titleModel }}
  AI_PROVIDER_TITLE_MODEL: {{ .Values.gateway.aiProvider.titleModel | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "ui") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
data:
  UIGRAPH_API_URL: {{ include "uigraph.internalApiUrl" . | quote }}
  UIGRAPH_GRAPHQL_URL: {{ include "uigraph.internalGraphqlUrl" . | quote }}
  UIGRAPH_GATEWAY_URL: {{ include "uigraph.internalGatewayUrl" . | quote }}
  # uigraph-ui's nginx proxies /enterprise/ to this (no trailing slash -- the location block
  # appends its own). Required at container start (envsubst'd directly into nginx.conf) as of
  # uigraph-ui 1.0.6-rc.17 -- unset when enterprise isn't in play, same gate as the api
  # ConfigMap's UIGRAPH_ENTERPRISE_SERVICE_URL above.
  {{- if .Values.app.enterpriseServiceUrl }}
  UIGRAPH_ENTERPRISE_URL: {{ .Values.app.enterpriseServiceUrl | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "mcp") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
data:
  PORT: {{ .Values.mcp.port | quote }}
  UIGRAPH_API_URL: {{ include "uigraph.internalApiUrl" . | quote }}
  UIGRAPH_GATEWAY_URL: {{ include "uigraph.internalGatewayUrl" . | quote }}
  UIGRAPH_FRONTEND_URL: {{ include "uigraph.frontendUrl" . | quote }}
  UIGRAPH_MCP_PUBLIC_URL: {{ include "uigraph.mcpPublicUrl" . | quote }}
