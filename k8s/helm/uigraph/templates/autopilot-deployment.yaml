{{- $ap := include "uigraph.autopilot" . | fromYaml }}
{{- if $ap.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uigraph.componentFullname" (dict "root" . "component" "autopilot") }}
  labels:
    {{- include "uigraph.componentLabels" (dict "root" . "component" "autopilot") | nindent 4 }}
spec:
  replicas: {{ $ap.replicaCount }}
  selector:
    matchLabels:
      {{- include "uigraph.componentSelectorLabels" (dict "root" . "component" "autopilot") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uigraph.componentLabels" (dict "root" . "component" "autopilot") | nindent 8 }}
      annotations:
        {{- include "uigraph.podAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autopilot
          image: '{{ $ap.image.repository }}:{{ $ap.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: {{ $ap.port }}
          env:
            - name: PORT
              value: {{ $ap.port | quote }}
            - name: LOG_LEVEL
              value: {{ $ap.logLevel | quote }}
            {{- if $ap.database.urlFromSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.autopilotDatabaseUrl | default "autopilot-database-url" }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.postgresPassword }}
            - name: DATABASE_URL
              value: {{ include "uigraph.autopilotDatabaseUrl" (dict "root" . "ap" $ap) | quote }}
            {{- end }}
            # Who is calling: Autopilot introspects user tokens through uigraph-api.
            - name: UIGRAPH_API_INTERNAL_URL
              value: {{ include "uigraph.internalApiUrl" . | quote }}
            # The keys below are optional: a Secret without them leaves that feature off (503 or
            # disabled) rather than stopping the pod.
            - name: AUTOPILOT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.autopilotInternalToken | default "autopilot-internal-token" }}
                  optional: true
            - name: AUTOPILOT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.autopilotEncryptionKey | default "autopilot-encryption-key" }}
                  optional: true
            # Context packs go to the same bucket as uigraph-api, under keys scoped by org and task.
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            - name: STORAGE_ENDPOINT
              value: {{ include "uigraph.storageEndpoint" . | quote }}
            - name: STORAGE_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: STORAGE_REGION
              value: {{ .Values.storage.region | quote }}
            - name: STORAGE_FORCE_PATH_STYLE
              value: {{ .Values.storage.forcePathStyle | quote }}
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.storageAccessKey }}
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.storageSecretKey }}
            {{- if $ap.linear.clientId }}
            - name: LINEAR_CLIENT_ID
              value: {{ $ap.linear.clientId | quote }}
            - name: LINEAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.linearClientSecret | default "linear-client-secret" }}
                  optional: true
            - name: LINEAR_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "uigraph.secretName" . }}
                  key: {{ .Values.secrets.keys.linearWebhookSecret | default "linear-webhook-secret" }}
                  optional: true
            - name: LINEAR_REDIRECT_URL
              value: {{ printf "%s/api/v1/autopilot/integrations/linear/callback" (include "uigraph.publicUrl" .) | quote }}
            - name: LINEAR_SUCCESS_URL
              value: {{ printf "%s/autopilot" (include "uigraph.frontendUrl" .) | quote }}
            {{- end }}
          # /health answers 503 while the database is unreachable. Readiness takes the pod out of
          # the Service then; liveness gets more slack so a short database blip doesn't restart it.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $ap.resources | nindent 12 }}
{{- end }}
