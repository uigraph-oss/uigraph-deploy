# Default values for the uigraph Helm chart.
# Targets an existing AWS EKS cluster with managed backing services (RDS, ElastiCache, S3)
# and AWS Load Balancer Controller already installed. See ../../README.md for prerequisites.

nameOverride: ''
fullnameOverride: ''

image:
  pullPolicy: IfNotPresent
  pullSecrets: []

# Merged into every Deployment's pod template annotations, alongside an automatic checksum of
# this chart's own configmap.yaml (so a config-only change still rolls pods — Kubernetes doesn't
# do that on its own for env vars sourced from a ConfigMap/Secret). Useful for a checksum of an
# externally-managed Secret this chart can't see the contents of (secrets.existingSecret).
podAnnotations: {}

# Published uigraph/* images currently run as root (no non-root USER baked in), so this defaults
# to false — flipping it to true against these images fails every pod with "container has
# runAsNonRoot and image will run as root". Revisit once the images themselves are confirmed to
# run as a non-root user.
podSecurityContext:
  runAsNonRoot: false

# Shared ServiceAccount used by uigraph-api and uigraph-gateway (the two services that talk to S3).
# Annotate with an IRSA role ARN to let those pods assume AWS credentials without static keys —
# see the "IRSA" section in ../../README.md for the prerequisite (uigraph-api S3 client must honor
# the default AWS credential chain when STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY are unset).
serviceAccount:
  create: true
  name: ''
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/uigraph-irsa

# Secrets. By default the chart renders a single Secret from `secrets.values` below.
# Set `existingSecret` to reference a Secret you manage externally (e.g. via External Secrets
# Operator syncing from AWS Secrets Manager) — the chart will then reference it by key name
# instead of rendering its own, and `secrets.values` is ignored.
secrets:
  existingSecret: ''
  keys:
    uigraphSecretKey: uigraph-secret-key
    # Optional. Only set while rotating the key; see uigraph-api/docs/mcp-connectors.md.
    uigraphSecretKeyPrevious: uigraph-secret-key-previous
    storageAccessKey: storage-access-key
    storageSecretKey: storage-secret-key
    postgresPassword: postgres-password
    adminPassword: admin-password
    figmaClientSecret: figma-client-secret
    githubAppClientSecret: github-app-client-secret
    githubAppPrivateKey: github-app-private-key
    githubWebhookSecret: github-webhook-secret
    redisAuthToken: redis-auth-token
    aiProviderApiKey: ai-provider-api-key
    aiSpeechApiKey: ai-speech-api-key
    aiTranscribeApiKey: ai-transcribe-api-key
    enterpriseInternalToken: enterprise-internal-token
    # Shared by the gateway and MCP for the gateway's internal, computation-only routes.
    gatewayInternalToken: gateway-internal-token
    slackClientSecret: slack-client-secret
    # Full DATABASE_URL for uigraph-autopilot, read only with autopilot.database.urlFromSecret.
    autopilotDatabaseUrl: autopilot-database-url
  # Only used when secrets.existingSecret is empty. Leave blank and pass with
  # `--set secrets.values.xxx=...` or a values override file — do not commit real secrets here.
  values:
    uigraphSecretKey: ''
    storageAccessKey: ''
    storageSecretKey: ''
    postgresPassword: ''
    adminPassword: ''
    figmaClientSecret: ''
    githubAppClientSecret: ''
    githubAppPrivateKey: ''
    githubWebhookSecret: ''
    redisAuthToken: ''
    aiProviderApiKey: ''
    aiSpeechApiKey: ''
    aiTranscribeApiKey: ''
    enterpriseInternalToken: ''
    # Blank derives a stable value from uigraphSecretKey, so a self-hosted install needs nothing.
    gatewayInternalToken: ''
    slackClientSecret: ''
    # Only rendered with autopilot.enabled and autopilot.database.urlFromSecret.
    autopilotDatabaseUrl: ''

# Managed Postgres (RDS). Password comes from the Secret (secrets.keys.postgresPassword).
postgres:
  host: ''
  port: 5432
  database: uigraph
  user: uigraph
  sslmode: require

# Managed Redis (ElastiCache). REDIS_URL is built from these fields; the AUTH token (if any)
# comes from the Secret (secrets.keys.redisAuthToken) and is substituted in via Kubernetes'
# $(VAR) env expansion, never stored in the ConfigMap.
# NOTE: rediss://+AUTH-token support depends on uigraph-api — see Assumptions in ../../README.md.
# Defaults to plain redis:// (no TLS/AUTH) until that's confirmed.
redis:
  host: ''
  port: 6379
  tls: false
  authEnabled: false

# Object storage. Defaults to real AWS S3 (STORAGE_BACKEND=s3), replacing the compose file's
# bundled MinIO entirely.
storage:
  backend: s3
  bucket: ''
  region: us-east-1
  # Leave empty to use the AWS SDK's default S3 endpoint. Only set this for S3-compatible
  # alternatives (e.g. an on-prem gateway).
  endpoint: ''
  # Public URL used when generating links shown to users, e.g. the bucket's virtual-hosted URL
  # (https://<bucket>.s3.<region>.amazonaws.com) or a CloudFront domain in front of it.
  publicEndpoint: ''
  forcePathStyle: false

# Public-facing app configuration.
app:
  # Base domain used to derive ingress hosts and public URLs (app.<domain>, sync.<domain>).
  domain: ''
  # Override the computed https://app.<app.domain> if you need a different public URL.
  publicUrl: ''
  frontendUrl: ''
  adminEmail: admin@uigraph.app
  # Shares the session cookie across subdomains, e.g. ".example.com" — needed only when
  # something on another subdomain (a marketing/billing site) needs the same session. Empty
  # (default) keeps the cookie host-only, which is correct for self-hosted's single-shared-URL
  # model and requires no change here.
  cookieDomain: ''

  # Enterprise integration seam — only relevant to the managed SaaS deployment, never to a
  # self-hosted install. When disabled (default), uigraph-api registers none of the internal
  # endpoints this reads from and never calls out anywhere; self-hosted behavior is unaffected.
  enterpriseEnabled: false
  # Public URL of the separate uigraph-enterprise service (e.g. https://enterprise.example.com).
  enterpriseServiceUrl: ''
  # enterpriseInternalToken is read from the Secret (secrets.keys.enterpriseInternalToken) — must
  # match the value configured on uigraph-enterprise's own deployment.
  # Internal URL of the independent uigraph-slack release (see uigraph-platform's
  # charts/uigraph-slack) that uigraph-ui's nginx proxies /slack/ to. Leave empty to use the
  # chart's own inert loopback default -- see the UIGRAPH_SLACK_URL comment in configmap.yaml
  # for why this one is never simply omitted the way enterpriseServiceUrl above is.
  slackServiceUrl: ''

  # Public embed links: a capability URL that renders one diagram or one video inside a page
  # outside UIGraph (a Confluence page, a README) with no session. Off by default on purpose —
  # an upgrade must never silently open an unauthenticated surface on an existing install.
  embedEnabled: false
  # Who may frame an embed, as CSP frame-ancestors. Empty (default) sets no frame-ancestors at
  # all, which is right for content whose URL is already the capability: no session cookie
  # reaches it and it performs no privileged action. Confluence Cloud needs
  # "https://*.atlassian.net,https://*.atlassian-dev.net" — Forge Custom UI sandboxes live on
  # the latter, and an allowlist that misses one of them breaks the macro silently.
  embedFrameAncestors: ''

figma:
  clientId: ''
  # clientSecret is read from the Secret (secrets.keys.figmaClientSecret); leave figma.clientId
  # empty to disable the Figma integration entirely.
  redirectUri: ''

githubApp:
  appId: ''
  slug: ''
  clientId: ''
  # clientSecret / privateKeyBase64 are read from the Secret (secrets.keys.githubAppClientSecret /
  # githubAppPrivateKey). uigraph-api requires appId/slug/clientId/clientSecret/privateKeyBase64
  # all set together, or all left empty to disable the integration.
  # webhookSecret (secrets.keys.githubWebhookSecret) is independent -- leave it empty to leave the
  # /api/v1/github-app/webhooks route unregistered even with the rest of the App configured.

slackApp:
  clientId: ''
  # clientSecret is read from the Secret (secrets.keys.slackClientSecret). Separate from
  # uigraph-slack's own SLACK_SIGNING_SECRET (uigraph-platform's charts/uigraph-slack).

ingress:
  enabled: true
  className: alb
  certificateArn: ''
  scheme: internet-facing
  # Defaults to app.<app.domain> / sync.<app.domain> / mcp.<app.domain> when left empty.
  appHost: ''
  gatewayHost: ''
  mcpHost: ''
  # Set gatewayIngress.enabled: false below to keep uigraph-gateway ClusterIP-only (no external
  # CI access) if you don't need `uigraph-cli` to sync from outside the cluster.
  gatewayIngress:
    enabled: true
  # Set mcpIngress.enabled: false to keep uigraph-mcp ClusterIP-only if you don't need AI
  # assistants connecting to it from outside the cluster.
  mcpIngress:
    enabled: true
  annotations: {}

# MCP connectors. See uigraph-api/docs/mcp-connectors.md for the full list of settings.
mcp:
  # Internal MCP servers the API may connect to. Private and internal addresses are blocked by
  # default. List each server by its full service name, or a whole namespace with a wildcard:
  #   - my-mcp.tools.svc.cluster.local        one service, any port
  #   - my-mcp.tools.svc.cluster.local:8080   one service and port
  #   - '*.mcp.svc.cluster.local'             every service in the "mcp" namespace
  # Servers listed here may also use plain http. Keep the list narrow: never list a wildcard for a
  # namespace that holds databases or other internal services.
  allowedAddresses: []
  # Lifts the private-address block for EVERY host, including the Kubernetes API server and the
  # node's cloud metadata endpoint. Prefer allowedAddresses.
  allowPrivateHosts: false

# Lifetimes for the OAuth tokens that MCP clients such as Claude get. Go durations: 15m, 2h, 720h.
# Leave a value empty to use the default. A shorter access token limits what a leaked one can do;
# the refresh token is how long a connected app stays signed in without the user approving again.
oauth:
  accessTokenTTL: 15m
  refreshTokenTTL: 720h # 30 days
  codeTTL: 5m

api:
  # Rendering walkthrough videos happens inside these pods: the image carries ffmpeg and
  # Chromium, and UIGRAPH_VIDEO_RENDER_WORKER defaults to "auto", so a video doc is rendered
  # by whichever API replica picks the job up.
  video:
    # auto | on | off. "auto" renders when ffmpeg and Chromium are both present, which they
    # are in the published image. Set "off" to keep these pods serving HTTP only; videos then
    # stay playable live in the app but never become MP4s (so no Confluence video embed).
    renderWorker: auto
    ffmpegPath: /usr/bin/ffmpeg
    chromiumPath: /usr/bin/chromium
    # Chromium pages rendered at once. Each one is a browser page holding a 1280x720 canvas,
    # so this multiplies memory -- raise resources.limits.memory below before raising this.
    renderPages: 3
    # Narration voice for rendered videos, matching a voice the gateway's speech provider
    # offers. Empty renders them silent.
    voiceKey: ''
  image:
    repository: uigraph/uigraph-api
    tag: '1.1.0-rc.1'
  replicaCount: 2
  port: 8080
  resources:
    # A request-serving API needs little, but video.renderWorker above puts Chromium and
    # ffmpeg in the same pod, and three concurrent render pages will not fit in 512Mi -- the
    # pod is OOM-killed mid-render, taking the HTTP traffic on that replica with it. The
    # limit is sized for rendering; requests stay small so idle replicas stay cheap. Dropping
    # it back to 512Mi is safe only with video.renderWorker set to "off".
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 3Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

graphql:
  image:
    repository: uigraph/uigraph-graphql
    tag: '1.1.0-rc.1'
  replicaCount: 2
  port: 8090
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

gateway:
  image:
    repository: uigraph/uigraph-gateway
    tag: '1.1.0-rc.1'
  replicaCount: 2
  port: 8080
  resources:
    # Handling an actual AI chat request (loading MCP tool schemas, the ai-sdk provider client,
    # streaming responses) needs meaningfully more headroom than idle/health-check traffic —
    # confirmed: the gateway process crashes with "JavaScript heap out of memory" on a chat
    # request at 512Mi.
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  aiProvider:
    npm: '@ai-sdk/openai-compatible'
    model: ''
    titleModel: ''
  # Narration for walkthrough videos: the voice that reads a script aloud. Leaving npm empty
  # turns narration off and the gateway simply has no voice -- every field here is optional
  # to it. The API key comes from the Secret (secrets.keys.aiSpeechApiKey).
  aiSpeech:
    npm: ''
    apiUrl: ''
    model: ''
    voice: ''
  # Word-level timings for that narration, so a scene cut lands between words instead of
  # through one. Key from the Secret (secrets.keys.aiTranscribeApiKey).
  aiTranscribe:
    npm: ''
    apiUrl: ''
    model: ''

ui:
  image:
    repository: uigraph/uigraph-ui
    tag: '1.1.0-rc.1'
  replicaCount: 2
  port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
mcp:
  image:
    repository: uigraph/uigraph-mcp
    tag: '1.1.0-rc.1'
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Autopilot (uigraph-autopilot). Optional, off by default: nothing below renders unless
# enabled is true. It owns its own Postgres database and runs its migrations on startup.
autopilot:
  enabled: false
  image:
    repository: uigraph/uigraph-autopilot
    tag: '0.1.0'
  # Keep at 1: migrations run on startup and are not yet guarded against two pods racing.
  replicaCount: 1
  port: 8086
  logLevel: info
  database:
    # By default DATABASE_URL is built from postgres.* above (same server, user and password)
    # with this database name. The database must exist: CREATE DATABASE autopilot;
    name: autopilot
    # Extra query parameters appended to the built URL, e.g. "search_path=autopilot" to use an
    # "autopilot" schema in postgres.database instead of a separate database (also set name to
    # postgres.database).
    params: ''
    # true reads the whole DATABASE_URL from the Secret (secrets.keys.autopilotDatabaseUrl)
    # instead of building it, e.g. to use a different user or server. With
    # secrets.existingSecret set, add that key to your Secret; otherwise set
    # secrets.values.autopilotDatabaseUrl.
    urlFromSecret: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
