# Default values for the uigraph Helm chart.
# Targets an existing AWS EKS cluster with managed backing services (RDS, ElastiCache, S3)
# and AWS Load Balancer Controller already installed. See ../../README.md for prerequisites.

nameOverride: ''
fullnameOverride: ''

image:
  pullPolicy: IfNotPresent
  pullSecrets: []

# Merged into every Deployment's pod template annotations, alongside an automatic checksum of
# this chart's own configmap.yaml (so a config-only change still rolls pods — Kubernetes doesn't
# do that on its own for env vars sourced from a ConfigMap/Secret). Useful for a checksum of an
# externally-managed Secret this chart can't see the contents of (secrets.existingSecret).
podAnnotations: {}

# Published uigraph/* images currently run as root (no non-root USER baked in), so this defaults
# to false — flipping it to true against these images fails every pod with "container has
# runAsNonRoot and image will run as root". Revisit once the images themselves are confirmed to
# run as a non-root user.
podSecurityContext:
  runAsNonRoot: false

# Shared ServiceAccount used by uigraph-api and uigraph-gateway (the two services that talk to S3).
# Annotate with an IRSA role ARN to let those pods assume AWS credentials without static keys —
# see the "IRSA" section in ../../README.md for the prerequisite (uigraph-api S3 client must honor
# the default AWS credential chain when STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY are unset).
serviceAccount:
  create: true
  name: ''
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/uigraph-irsa

# Secrets. By default the chart renders a single Secret from `secrets.values` below.
# Set `existingSecret` to reference a Secret you manage externally (e.g. via External Secrets
# Operator syncing from AWS Secrets Manager) — the chart will then reference it by key name
# instead of rendering its own, and `secrets.values` is ignored.
secrets:
  existingSecret: ''
  keys:
    uigraphSecretKey: uigraph-secret-key
    storageAccessKey: storage-access-key
    storageSecretKey: storage-secret-key
    postgresPassword: postgres-password
    adminPassword: admin-password
    figmaClientSecret: figma-client-secret
    githubAppClientSecret: github-app-client-secret
    githubAppPrivateKey: github-app-private-key
    githubWebhookSecret: github-webhook-secret
    redisAuthToken: redis-auth-token
    aiProviderApiKey: ai-provider-api-key
    enterpriseInternalToken: enterprise-internal-token
    slackSigningSecret: slack-signing-secret
  # Only used when secrets.existingSecret is empty. Leave blank and pass with
  # `--set secrets.values.xxx=...` or a values override file — do not commit real secrets here.
  values:
    uigraphSecretKey: ''
    storageAccessKey: ''
    storageSecretKey: ''
    postgresPassword: ''
    adminPassword: ''
    figmaClientSecret: ''
    githubAppClientSecret: ''
    githubAppPrivateKey: ''
    githubWebhookSecret: ''
    redisAuthToken: ''
    aiProviderApiKey: ''
    enterpriseInternalToken: ''
    slackSigningSecret: ''

# Managed Postgres (RDS). Password comes from the Secret (secrets.keys.postgresPassword).
postgres:
  host: ''
  port: 5432
  database: uigraph
  user: uigraph
  sslmode: require

# Managed Redis (ElastiCache). REDIS_URL is built from these fields; the AUTH token (if any)
# comes from the Secret (secrets.keys.redisAuthToken) and is substituted in via Kubernetes'
# $(VAR) env expansion, never stored in the ConfigMap.
# NOTE: rediss://+AUTH-token support depends on uigraph-api — see Assumptions in ../../README.md.
# Defaults to plain redis:// (no TLS/AUTH) until that's confirmed.
redis:
  host: ''
  port: 6379
  tls: false
  authEnabled: false

# Object storage. Defaults to real AWS S3 (STORAGE_BACKEND=s3), replacing the compose file's
# bundled MinIO entirely.
storage:
  backend: s3
  bucket: ''
  region: us-east-1
  # Leave empty to use the AWS SDK's default S3 endpoint. Only set this for S3-compatible
  # alternatives (e.g. an on-prem gateway).
  endpoint: ''
  # Public URL used when generating links shown to users, e.g. the bucket's virtual-hosted URL
  # (https://<bucket>.s3.<region>.amazonaws.com) or a CloudFront domain in front of it.
  publicEndpoint: ''
  forcePathStyle: false

# Public-facing app configuration.
app:
  # Base domain used to derive ingress hosts and public URLs (app.<domain>, sync.<domain>).
  domain: ''
  # Override the computed https://app.<app.domain> if you need a different public URL.
  publicUrl: ''
  frontendUrl: ''
  adminEmail: admin@uigraph.app
  # Shares the session cookie across subdomains, e.g. ".example.com" — needed only when
  # something on another subdomain (a marketing/billing site) needs the same session. Empty
  # (default) keeps the cookie host-only, which is correct for self-hosted's single-shared-URL
  # model and requires no change here.
  cookieDomain: ''

  # Enterprise integration seam — only relevant to the managed SaaS deployment, never to a
  # self-hosted install. When disabled (default), uigraph-api registers none of the internal
  # endpoints this reads from and never calls out anywhere; self-hosted behavior is unaffected.
  enterpriseEnabled: false
  # Public URL of the separate uigraph-enterprise service (e.g. https://enterprise.example.com).
  enterpriseServiceUrl: ''
  # enterpriseInternalToken is read from the Secret (secrets.keys.enterpriseInternalToken) — must
  # match the value configured on uigraph-enterprise's own deployment.

figma:
  clientId: ''
  # clientSecret is read from the Secret (secrets.keys.figmaClientSecret); leave figma.clientId
  # empty to disable the Figma integration entirely.
  redirectUri: ''

githubApp:
  appId: ''
  slug: ''
  clientId: ''
  # clientSecret / privateKeyBase64 are read from the Secret (secrets.keys.githubAppClientSecret /
  # githubAppPrivateKey). uigraph-api requires appId/slug/clientId/clientSecret/privateKeyBase64
  # all set together, or all left empty to disable the integration.
  # webhookSecret (secrets.keys.githubWebhookSecret) is independent -- leave it empty to leave the
  # /api/v1/github-app/webhooks route unregistered even with the rest of the App configured.

ingress:
  enabled: true
  className: alb
  certificateArn: ''
  scheme: internet-facing
  # Defaults to app.<app.domain> / sync.<app.domain> / mcp.<app.domain> when left empty.
  appHost: ''
  gatewayHost: ''
  mcpHost: ''
  # Set gatewayIngress.enabled: false below to keep uigraph-gateway ClusterIP-only (no external
  # CI access) if you don't need `uigraph-cli` to sync from outside the cluster.
  gatewayIngress:
    enabled: true
  # Set mcpIngress.enabled: false to keep uigraph-mcp ClusterIP-only if you don't need AI
  # assistants connecting to it from outside the cluster.
  mcpIngress:
    enabled: true
  annotations: {}

api:
  image:
    repository: uigraph/uigraph-api
    tag: '1.0.7-rc.4'
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: '1', memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

graphql:
  image:
    repository: uigraph/uigraph-graphql
    tag: '1.0.5-rc.2'
  replicaCount: 2
  port: 8090
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

gateway:
  image:
    repository: uigraph/uigraph-gateway
    tag: '1.0.5-rc.2'
  replicaCount: 2
  port: 8080
  resources:
    # Handling an actual AI chat request (loading MCP tool schemas, the ai-sdk provider client,
    # streaming responses) needs meaningfully more headroom than idle/health-check traffic —
    # confirmed: the gateway process crashes with "JavaScript heap out of memory" on a chat
    # request at 512Mi.
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  aiProvider:
    npm: '@ai-sdk/openai-compatible'
    model: ''
    titleModel: ''

ui:
  image:
    repository: uigraph/uigraph-ui
    tag: '1.0.6-rc.2'
  replicaCount: 2
  port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
mcp:
  image:
    repository: uigraph/uigraph-mcp
    tag: '1.0.5-rc.1'
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

slack:
  # Slack app for UiGraph. Off by default: unlike api/graphql/gateway/ui/mcp this isn't part of
  # every install — it needs a real Slack app (SLACK_SIGNING_SECRET) and runs in HTTP mode
  # (multi-workspace, installations resolved from uigraph-api), authenticated with the same
  # shared secrets.keys.enterpriseInternalToken uigraph-api's own /internal/v1/slack-app/*
  # endpoints validate against. When enabled, uigraph-ui's nginx proxies /slack/ to it — see
  # UIGRAPH_SLACK_URL in the ui ConfigMap below.
  enabled: false
  image:
    repository: uigraph/uigraph-slack
    tag: '1.0.0'
  replicaCount: 2
  port: 3000
  resources:
    # Same ai-sdk + MCP tool-calling path as uigraph-gateway per request (Slack event in, LLM
    # call with tools, reply out) -- sized the same way; see gateway.resources above for the OOM
    # incident that sizing is based on.
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  aiProvider:
    npm: '@ai-sdk/openai-compatible'
    model: ''